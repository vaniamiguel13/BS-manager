# Local development only. No public ingress or database port is published.
x-app: &app
  build: .
  image: ${BS_MANAGER_IMAGE:-bs-manager-local}
  depends_on:
    db:
      condition: service_healthy
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
x-environment: &environment
  SECRET_KEY: ${SECRET_KEY:?Run python3 scripts/setup-local.py first}
  DATABASE_HOST: db
  DATABASE_NAME: bsmanager
  COMPANY_NAME: ${COMPANY_NAME:-BS Manager}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Lisbon}
  DEFAULT_VACATION_DAYS: ${DEFAULT_VACATION_DAYS:-22}
  EXTRA_HOLIDAYS: ${EXTRA_HOLIDAYS:-}
  SESSION_COOKIE_SECURE: "0"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bsmanager
      POSTGRES_USER: bsmanager_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Run python3 scripts/setup-local.py first}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup-local.py first}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U bsmanager_owner -d bsmanager"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    profiles: [tools]
    environment:
      <<: *environment
      DATABASE_USER: bsmanager_owner
      DATABASE_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: [flask, --app, wsgi, init-db]
  backup:
    build: ./docker/backup
    image: ${BS_MANAGER_BACKUP_IMAGE:-bs-manager-backup-tools}
    profiles: [backup]
    depends_on:
      db:
        condition: service_healthy
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: bsmanager_owner
      PGDATABASE: bsmanager
      PGPASSFILE: /run/secrets/pgpass
      BACKUP_DIR: /backups
      BACKUP_RECIPIENTS_FILE: /run/secrets/backup_recipients
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_PGPASS_FILE:-./.backup-secrets/pgpass}
        target: /run/secrets/pgpass
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_RECIPIENTS_FILE:-./.backup-secrets/recipients}
        target: /run/secrets/backup_recipients
        read_only: true
        bind:
          create_host_path: false
  web:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *environment
      DATABASE_USER: bsmanager
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  db-data:
